<!DOCTYPE html>
<html>
  <head>
    <title>Dengue Virus Methyl Transferase</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="design.css">

  </head>
  <body>
    <!-- Viewer Container -->
    <div id="gl"></div>

    <!-- Inspector for Visualization Styles -->
    <div id="inspector">
      <h1>Choose Style</h1>
      <ul>
        <li id="preset">Preset</li>
        <li id="cartoon">Cartoon</li>
        <li id="tube">Tube</li>
        <li id="lines">Lines</li>
        <li id="line-trace">Line Trace</li>
        <li id="sline">Smooth Line Trace</li>
        <li id="trace">Trace</li>
      </ul>
    </div>

    <!-- Status Display -->
    <div id="status">Initializing...</div>

    <!-- Picked Atom Name Display -->
    <div id="picked-atom-name">&nbsp;</div>

    <!-- Include pv.js Library -->
    <script src="js/pv.min.js"></script>

    <!-- Integrated Script -->
    <script>
      // Initialize the Viewer
      var parent = document.getElementById('gl');
      var viewer = pv.Viewer(parent, {
        quality: 'medium',
        width: 'auto',
        height: 'auto',
        antialias: true,
        outline: true,
        selectionColor: 'red'
      });

      var structure;
      var lastAtom = null; // For measuring distances
      var prevPicked = null; // For highlighting atoms on mouseover

      /**
       * Sets the color for a specific atom.
       * @param {Object} go - The graphics object.
       * @param {Object} atom - The atom to color.
       * @param {String|Array} color - The color to apply.
       */
      function setColorForAtom(go, atom, color) {
        var view = go.structure().createEmptyView();
        view.addAtom(atom);
        go.colorBy(pv.color.uniform(color), view);
      }

      /**
       * Visualization Style Functions
       */
      function lines() {
        viewer.clear();
        viewer.lines('structure', structure);
      }

      function cartoon() {
        viewer.clear();
        viewer.cartoon('structure', structure, { color: pv.color.ssSuccession() });
      }

      function lineTrace() {
        viewer.clear();
        viewer.lineTrace('structure', structure);
      }

      function sline() {
        viewer.clear();
        viewer.sline('structure', structure);
      }

      function tube() {
        viewer.clear();
        viewer.tube('structure', structure);
      }

      function trace() {
        viewer.clear();
        viewer.trace('structure', structure);
      }

      function preset() {
        viewer.clear();
        var ligand = structure.select({ rnames: ['RVP', 'SAH'] });
        viewer.ballsAndSticks('ligand', ligand);
        viewer.cartoon('protein', structure, { color: pv.color.ssSuccession() });
      }

      /**
       * Loads a PDB file and initializes the viewer.
       * @param {String} pdb_id - The PDB ID to load.
       */
      function load(pdb_id) {
        document.getElementById('status').innerHTML = 'Loading ' + pdb_id + '...';
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'pdbs/' + pdb_id + '.pdb');
        xhr.setRequestHeader('Content-type', 'application/x-pdb');
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              structure = pv.io.pdb(xhr.responseText);
              preset();
              viewer.centerOn(structure);
              viewer.autoZoom();
              document.getElementById('status').innerHTML = 'Loaded PDB ID: ' + pdb_id;
            } else {
              document.getElementById('status').innerHTML = 'Failed to load PDB ID: ' + pdb_id;
            }
          }
        };
        xhr.send();
      }

      /**
       * Loads the default PDB structure on page load.
       */
      function transferase() {
        load('6pv8'); // Change to your desired default PDB ID
      }

      /**
       * Attach Event Listeners to Inspector Buttons
       */
      document.getElementById('cartoon').onclick = cartoon;
      document.getElementById('line-trace').onclick = lineTrace;
      document.getElementById('preset').onclick = preset;
      document.getElementById('lines').onclick = lines;
      document.getElementById('trace').onclick = trace;
      document.getElementById('sline').onclick = sline;
      document.getElementById('tube').onclick = tube;

      /**
       * Handle Window Resize to Fit Viewer to Parent
       */
      window.onresize = function () {
        viewer.fitParent();
      };

      /**
       * Initialize the Viewer on DOM Content Loaded
       */
      document.addEventListener('DOMContentLoaded', transferase);

      /**
       * Mousemove Handler for Highlighting Atoms on Hover
       */
      parent.addEventListener('mousemove', function (event) {
        var rect = viewer.boundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        var picked = viewer.pick({ x: x, y: y });

        // If the same atom is picked as before, do nothing
        if (prevPicked !== null && picked !== null && picked.target() === prevPicked.atom) {
          return;
        }

        // Reset color of previously picked atom
        if (prevPicked !== null) {
          setColorForAtom(prevPicked.node, prevPicked.atom, prevPicked.color);
        }

        if (picked !== null) {
          var atom = picked.target();
          document.getElementById('picked-atom-name').innerHTML = atom.qualifiedName();

          // Get the current color of the atom
          var color = [0, 0, 0, 0];
          picked.node().getColorForAtom(atom, color);
          prevPicked = { atom: atom, color: color, node: picked.node() };

          // Highlight the atom in red
          setColorForAtom(picked.node(), atom, 'red');
        } else {
          document.getElementById('picked-atom-name').innerHTML = '&nbsp;';
          prevPicked = null;
        }

        viewer.requestRedraw();
      });

      /**
       * Click Handler for Measuring Distances Between Atoms
       */
      viewer.addListener('click', function (picked) {
        if (picked === null) return;
        var target = picked.target();
        if (target.qualifiedName === undefined) {
          return;
        }
        var node = picked.node();
        var view = node.structure().createEmptyView();

        if (lastAtom !== null) {
          // Remove previous distance measurements
          viewer.rm('dist.*');

          var g = viewer.customMesh('dist.line');
          var midPoint = pv.vec3.clone(lastAtom.pos());
          pv.vec3.add(midPoint, midPoint, target.pos());
          pv.vec3.scale(midPoint, midPoint, 0.5);

          // Add a tube connecting the two atoms
          g.addTube(lastAtom.pos(), target.pos(), 0.1, { cap: true, color: 'white' });

          // Calculate and display the distance
          var d = pv.vec3.distance(lastAtom.pos(), target.pos());
          viewer.label('dist.label', d.toFixed(2) + ' Å', midPoint);

          lastAtom = null;
        } else {
          lastAtom = target;
          view.addAtom(target);
        }

        node.setSelection(view);
        viewer.requestRedraw();
      });
    </script>
  </body>
</html>
